name: Supply chain

# Written by `agentsmith compliance enable`. Dependency scan and an SBOM for this
# application (OB-SUPPLY-CHAIN). Add static analysis for your own stack here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ vars.AGENTSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Python dependencies"
        run: |
          if [ -f requirements.lock ]; then
            pipx run pip-audit==2.9.0 -r requirements.lock --disable-pip --no-deps
          elif [ -f requirements.txt ]; then
            # Without a lock: pip-audit resolves the ranges and audits the result.
            pipx run pip-audit==2.9.0 -r requirements.txt
          else
            echo "no Python requirements file"
          fi
      - name: "SBOM"
        run: |
          if [ -f requirements.lock ]; then pipx run --spec cyclonedx-bom==7.1.0 cyclonedx-py requirements requirements.lock -o sbom.cdx.json; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore
