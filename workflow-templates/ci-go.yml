name: "CI: Go Guardrails"

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    # develop too: cd-staging.yml deploys only after THIS workflow succeeds on
    # a push to develop, so without it staging never deploys.
    branches: ["main", "develop"]

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: "Guardrails — Go"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml networkx

      - name: Download modules
        run: go mod download

      - name: Verify modules
        # agentsmith:gate
        run: go mod verify

      - name: Format check
        # agentsmith:gate
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ gofmt violations:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        # agentsmith:gate
        run: go vet ./...

      - name: "Validate Knowledge Graph (Pillar 2)"
        # agentsmith:gate
        run: |
          python3 scripts/map_codebase.py --quiet
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          committed = Path(".agent-rfc/fixtures/knowledge_graph.json")
          if not committed.exists():
              print("⚠️  No committed knowledge_graph.json — skipping staleness check.")
              sys.exit(0)

          with committed.open() as f:
              data = json.load(f)

          node_count = len(data.get("nodes", []))
          edge_count = len(data.get("edges", data.get("links", [])))
          print(f"✅ Knowledge Graph: {node_count} nodes, {edge_count} edges")

          if node_count == 0:
              print("⚠️  Knowledge Graph is empty — map_codebase.py may have failed.")
              sys.exit(1)
          EOF
        # Still warn-only: the graph becomes blocking in G4, when it is built at
        # onboarding and committed. Blocking it before a tenant HAS one would fail
        # every CI run for a control that is not provisioned yet.
        continue-on-error: true

      - name: "RFC gate (Pillar 1)"
        # agentsmith:gate
        run: |
          if [ ! -f ".agenticframework/org-policy.yaml" ]; then
            echo "ℹ️  Developer mode — RFC gate skipped."
            exit 0
          fi
          RFC_COUNT=$(find .agent-rfc -maxdepth 1 -name "*.md" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "${RFC_COUNT:-0}" -eq 0 ]; then
            echo "❌ Enterprise policy: at least one RFC required under .agent-rfc/ before merging."
            exit 1
          fi
          echo "✅ RFC gate: ${RFC_COUNT} RFC(s) found."

      - name: "IDE config drift check (Pillar 6/7)"
        # agentsmith:gate
        # Blocking since G3: the rule files are generated from one source, so
        # drift means a repo is telling its agents something the framework did
        # not say. Regenerate with `python3 scripts/generate-ide-config.py --write`.
        run: python3 scripts/generate-ide-config.py --check-only

      - name: "Framework health check (Pillar 3/5)"
        env:
          AGENT_PHOENIX_ENDPOINT: ${{ secrets.AGENT_PHOENIX_ENDPOINT || '' }}
          AGENT_OWNER_ID: ${{ secrets.AGENT_OWNER_ID || 'ci@agenticframework' }}
        run: python3 scripts/verify_system.py || true # non-blocking — inform, not gate

      - name: Test (with race detector)
        # agentsmith:gate
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  eval-scorecard:
    name: "Eval scorecard"
    uses: ./.github/workflows/eval-scorecard.yml
    secrets: inherit

  eval-fairness:
    name: "Fairness eval (opt-in)"
    uses: ./.github/workflows/eval-fairness.yml
    secrets: inherit
    with:
      fairness_mode: warn

  eval-hallucination:
    name: "Hallucination eval (hard-fail)"
    uses: ./.github/workflows/eval-hallucination.yml
    secrets: inherit

  eval-ttft-live:
    name: "TTFT live (opt-in)"
    uses: ./.github/workflows/eval-ttft-live.yml
    secrets: inherit

  # The same gate ci-python-fastapi.yml runs. The harness's controls are not
  # Python-specific — it grades THIS repo's .agent-rfc/security/ pack and the
  # vendored runtime — so a Go or TS tenant was simply ungraded without it.
  # Strict, like Python: a tenant still carrying the shipped placeholder pack
  # fails here until it declares its own risks and high-impact actions.
  security-checks:
    name: "Security harness"
    uses: ./.github/workflows/eval-security.yml
    secrets: inherit
    with:
      strict: true
