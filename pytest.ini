[pytest]
asyncio_mode = auto

# BOTH suites. `testpaths = runtime/test` alone meant a bare `pytest` at the
# repo root collected 171 of 292 tests and reported green while skipping every
# scripts/test/ file — the security harness, eval suites, hooks behaviour, cost
# router and promotion loop. Only .github/workflows/self-test.yml caught those,
# because it names the two directories explicitly.
testpaths = runtime/test scripts/test

# scripts/*.py are invoked as `python3 scripts/foo.py`, which puts scripts/ on
# sys.path[0]; their tests import `_shared`, `eval_judge` etc. the same way, so
# the directory has to be importable when pytest drives them instead.
pythonpath = . scripts
