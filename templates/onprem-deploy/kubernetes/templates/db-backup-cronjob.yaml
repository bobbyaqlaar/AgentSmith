{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "onprem.fullname" . }}-db-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  f="/backup/agentsmith-$(date -u +%Y%m%dT%H%M%SZ).dump" &&
                  pg_dump --format=custom --no-owner --file="$f" "$DATABASE_URL" &&
                  sha256sum "$f" > "$f.sha256"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.databaseUrlSecret }}
                      key: DATABASE_URL
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim }}
{{- end }}
