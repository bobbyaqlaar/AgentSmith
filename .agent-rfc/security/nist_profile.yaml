# AgentSmith framework — NIST AI RMF profile mapping.
#
# Replaces the shipped template, which this repo was carrying verbatim down to
# `organization: "REPLACE_ME"`. Roles below are the framework project's own —
# a tenant maps its own owners against its own deployment.
#
# Not a certification and not an assessment: this records which SEC-* controls
# the framework claims under each RMF function, so an evidence pack points at
# something specific. Clause-level conformance is org-owned work (see
# docs/security-framework-map.md and docs/iso-42001-control-map.md).
version: 1
organization: "Aqlaar — AgentSmith framework"
functions:
  GOVERN:
    roles:
      - name: Framework maintainer
        control_ids: [SEC-RBAC-001, SEC-AUDIT-001, SEC-CHANGE-001]
  MAP:
    roles:
      - name: Risk owner (maintainer)
        control_ids: [SEC-RISK-001, SEC-AGENCY-001, SEC-GW-001]
  MEASURE:
    roles:
      - name: Eval owner (maintainer)
        control_ids: [SEC-EVAL-001, SEC-EVAL-002, SEC-EVAL-003, SEC-ADV-001]
  MANAGE:
    roles:
      - name: Ops owner (deploying tenant)
        control_ids: [SEC-HITL-001, SEC-DLQ-001, SEC-BUDGET-001, SEC-SELF-001]
evidence_artifacts:
  - name: Framework self-test
    path: .github/workflows/self-test.yml
    notes: Runs the security harness --strict plus both pytest suites on every push.
  - name: Security control map
    path: docs/security-framework-map.md
    notes: Live SEC-* status with owner (Framework / Org) per control.
  - name: Security evidence pack
    path: security-evidence/
    notes: >-
      Generated by run-security-checks.py --evidence-pack and uploaded as a CI
      artifact by eval-security.yml; not committed.
