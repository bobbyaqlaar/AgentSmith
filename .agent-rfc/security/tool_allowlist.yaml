# AgentSmith framework — tool allowlist (SEC-TOOL-001). Deny-by-default under
# TOOL_ALLOWLIST_STRICT=1.
#
# The framework registers no production @tools of its own — ToolRegistry is the
# mechanism it ships for tenants to use, and a tenant's own allowlist is what
# governs its tools (KYC_Sentinel/.agent-rfc/security/tool_allowlist.yaml is a
# filled-in example). This file exists so the repo carries an explicit,
# deliberately-empty allowlist rather than the shipped `example_tool`
# placeholder it used to hold verbatim.
#
# Empty `tools` is not the same as no file: with strict mode on, a loaded but
# empty allowlist denies every tool, which is the correct posture for a repo
# that should be registering none.
#
# SEC-TOOL-001 now reads THIS file rather than the shipped template, and
# checks it against the tools a repo actually registers (found statically, so
# the harness never imports tenant code). An empty `tools` with nothing
# registered — the framework's case — is a pass: correct posture, not a gap.
# An empty list WITH registered tools is a failure, since strict mode would
# deny every one of them.
version: 1
tools: []
