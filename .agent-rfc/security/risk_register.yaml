# AgentSmith framework — residual risk register (SEC-RISK-001).
#
# THIS repo's own risks, as a repo governed by AgentSmith. It was previously a
# byte-for-byte copy of fixtures/security/templates/risk_register.yaml, so the
# framework's own self-test graded SEC-RISK-001 against RISK-EXAMPLE-001 and
# reported Met — a compliance artifact certifying a placeholder. The runner now
# fails --strict on the template sentinel; this file is what replaced it.
#
# Scope: risks the FRAMEWORK carries. A tenant's application risks belong in
# that tenant's own pack (see KYC_Sentinel/.agent-rfc/security/ for a worked
# example). The harness validates schema, not content truth — these are claims
# owned by a human maintainer, not evidence generated by an agent.
version: 1
entries:
  - id: RISK-FW-001
    description: >-
      Git hooks installed machine-wide execute on every commit and checkout in
      any opted-in repo, and the pre-commit hook runs the GLOBAL
      ~/.agent-framework/scripts/check_bare_except.py rather than the repo
      copy. A bad global script therefore affects every governed repo at once,
      and the two copies can drift silently.
    severity: high
    mitigations:
      - Opt-in model — hooks only provision and enforce in repos carrying .agenticframework/enabled.
      - Enterprise pack ships GPG-signed hook bundles with HMAC-validated break-glass bypass.
      - scripts/test/test_hooks_behavior.py covers hook behaviour in CI.
    control_ids:
      - SEC-RISK-001
      - SEC-CHANGE-001

  - id: RISK-FW-002
    description: >-
      The LLM gateway is the single choke point for provider calls, so a
      guardrail that fails open there (prompt guard, PII scrub, moderation
      hook, tool allowlist) silently removes that control for every tenant on
      the release, with no per-tenant signal.
    severity: high
    mitigations:
      - prompt_guard.is_enforcing() is one shared definition of "blocking" for the gateway and the SEC-PROMPT-001 harness, so the control cannot report Met while enforcement is off.
      - input_guardrail.detect_pii and trace_redactor share one Luhn validator, so pre-call and post-call PII detection cannot diverge.
      - runtime/test/ covers each guardrail; the security harness runs --strict in framework self-test.
    control_ids:
      - SEC-GW-001
      - SEC-PROMPT-001
      - SEC-PII-001
      - SEC-TOOL-001

  - id: RISK-FW-003
    description: >-
      Framework workflow helpers encode the HITL contract for every tenant, so
      a defect there bypasses mandatory human review across all of them at
      once. Demonstrated: run_with_hitl_gate re-executed its gate activity and
      honoured the second, non-deterministic result, which could approve a
      high-impact action with no human signal.
    severity: high
    mitigations:
      - Callers pass gate_result= when they already hold the needs_hitl decision, so no second execution can disagree with the first.
      - runtime/test/test_hitl_gate.py asserts the resume activity never runs without an approval signal, and runs without Temporal or Postgres so it is not skipped locally.
      - HITL timeout dead-letters rather than failing the workflow, so a parked request is never lost.
    control_ids:
      - SEC-HITL-001
      - SEC-DLQ-001

  - id: RISK-FW-004
    description: >-
      Default model routing decides where every tenant's prompts go. A cloud
      tier reachable from the default degrade ladder means a budget breach can
      move traffic across a trust boundary without an operator acting.
    severity: medium
    mitigations:
      - runtime/models.yaml is local-only (all Ollama, all zero-cost); the ladder can only degrade to a smaller local model.
      - Groq and Vertex AI entries ship commented out — opting in is a deliberate edit.
      - degrade_tier is recorded on every span, so a degrade is observable in Phoenix and the Ops Portal.
    control_ids:
      - SEC-BUDGET-001
      - SEC-GW-001
      - SEC-AUDIT-001

  - id: RISK-FW-005
    description: >-
      The eval judge gates promotion for every tenant. A judge that grades its
      own author's output inflates scores and hides exactly the failures the
      gate exists to catch.
    severity: medium
    mitigations:
      - The judge role is declared in models.yaml and resolved by one function (scripts/_shared.py judge_model()), so CI evals and a tenant's runtime judge cannot drift onto different models by accident.
      - The framework judge (falcon3:3b) is deliberately not the architect model; a test asserts judge_independence_warning stays silent against the live registry.
      - runtime.judging holds the shared citation-grounding and pair-parity primitives, so the CI gate and per-request enforcement run identical logic.
    control_ids:
      - SEC-EVAL-001
      - SEC-EVAL-003

  - id: RISK-FW-006
    description: >-
      install-ai-stack.sh is documented as a `curl | bash` one-liner and writes
      IDE rules, hooks and CI workflows into repos. Its remote path downloads
      release tarballs, so a compromised or missing release changes what every
      new machine installs.
    severity: medium
    mitigations:
      - Release artifacts are optionally GPG-signed (release.yml, same mechanism as the enterprise hook bundle).
      - AI_STACK_FRAMEWORK_REPO allows pinning to a self-hosted mirror or fork.
      - Known gap — no vX.Y.Z tag has been cut, so the release path currently 404s and only the local-checkout install works. Tracked in FIXES_AND_CLEANUP.md; cut a release before advertising the one-liner.
    control_ids:
      - SEC-CHANGE-001
      - SEC-RISK-001
