# AgentSmith — Release CI (docs/DESIGN.md › Framework vs Application Release).
#
# Triggers on a vX.Y.Z tag, pushed by hand on the merged release commit. Builds
# and attaches the artifacts install-ai-stack.sh fetches when run outside a
# checkout, then installs from them as a stranger would. These filenames are a
# contract, not arbitrary:
#   agentsmith-source.tar.gz   (the tagged tree; the installer unpacks it and
#                               installs from it as from a checkout)
#   install-ai-stack.sh        (the bootstrap script ITSELF)
#   *.sha256                   (each of those two's checksum)
#   widget.js                  (the in-app widget a tenant embeds)
#
# The installer is an asset because docs/UserManual.md documents fetching it from a
# release URL and checksum-verifying it before running. It never was one: the
# release shipped only the tarballs the installer downloads, so the documented
# `curl .../releases/download/<tag>/install-ai-stack.sh | bash` 404'd at every
# version, and the .sha256 the docs piped into `shasum --check` had never
# existed. test_release_artifact_contract.py could not catch it — it verified
# the artifacts the installer downloads, and the installer does not download
# itself. The docs are now covered by a test too.
#
# Optionally GPG-signs each tarball if ORG_GPG_KEY_ID + ORG_GPG_PRIVATE_KEY
# secrets are configured.

name: "Release"

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Build release artifacts"
        # One script, shared with Self-Test's check of the release install, so
        # what that check exercises is what ships.
        run: bash scripts/build_release_assets.sh dist

      - name: "Import org GPG key (optional)"
        if: ${{ env.ORG_GPG_PRIVATE_KEY != '' }}
        env:
          ORG_GPG_PRIVATE_KEY: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
        run: echo "$ORG_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: "Sign release artifacts (optional)"
        if: ${{ env.ORG_GPG_KEY_ID != '' }}
        env:
          ORG_GPG_KEY_ID: ${{ secrets.ORG_GPG_KEY_ID }}
        run: |
          # install-ai-stack.sh is included deliberately: it is the one artifact
          # users pipe straight into a shell, so signing the tarballs it fetches
          # while leaving the fetcher unsigned protects the wrong end of the
          # chain. The .sha256 is not signed — it is an integrity check against
          # a corrupted download, not a trust anchor; the detached .sig is.
          for f in dist/*.tar.gz dist/install-ai-stack.sh; do
            gpg --batch --yes --local-user "$ORG_GPG_KEY_ID" --detach-sign --output "$f.sig" "$f"
          done
          ls -la dist/

      # Signed provenance for what is published (OB-SUPPLY-CHAIN, keyless through the
      # workflow's own identity): `gh attestation verify` checks a download.
      - name: "Attest build provenance"
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Per docs/DESIGN.md › Framework vs Application Release: release notes should call out span-attribute or
          # hook-interface breaking changes explicitly — generate_release_notes
          # produces a baseline from merged PRs; amend manually for breaking changes.

  # The README's Quick Start, run for real against what was just published, from
  # the URL a stranger uses. It cannot unpublish, but a broken release shows red
  # within minutes rather than at the first person who tries it.
  verify-published-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: "The published release installs, and its first commits pass"
        run: bash scripts/check_release_install.sh "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
