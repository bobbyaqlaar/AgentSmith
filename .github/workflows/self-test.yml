# AgentSmith — Self-Test CI.
#
# Tests the FRAMEWORK itself (this repo), not a tenant project. Tenant repos
# get their own ci-<stack>.yml / cd-staging.yml / cd-production.yml from
# workflow-templates/ via agentsmith tenant init — this workflow is unrelated to those.

name: "Self-Test"

on:
  push:
    branches: [main]
  pull_request:
  # Every curated mutation suite, weekly, whatever changed: a pull request runs
  # only the suites its files can affect (.agent-rfc/designs/mutation-ci-fast.md).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  # Design before code, review before merge — checked on every pushed commit
  # (docs/process-gates.md). The local commit-msg hook runs the same function,
  # but only in a clone that armed it; this is the check no clone can skip.
  # Required on `main` (2026-09-29), with the other six jobs (2026-09-30), and
  # enforced on admins too since 2026-10-01: nothing reaches `main` except
  # through a pull request whose head passed all seven — the owner included
  # (docs/process-gates.md › Limits, stated).
  process-gates:
    name: "Process gates (design + review)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gate runs in the framework environment (pydantic + OTel), the same
      # one the local hooks resolve. Installed from the list that travels with
      # scripts/, so CI and a developer's machine run the same gate.
      - run: pip install -r scripts/requirements-gate.txt
      - name: "Every gated commit has a design and a clean review"
        # agentsmith:gate
        env:
          # A pull request's range is base..head; a push's is before..sha,
          # where `before` is all zeros for a new branch (the script then
          # checks the head commit only, and says so).
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/process_gate.py ci --base "$BASE" --head "$HEAD_SHA" --json "${RUNNER_TEMP:-/tmp}/dev-record.json"
      # What the gate decided, to the portal's Dev workspace — after the gate,
      # whatever it decided: a failed range is what the portal most needs to show.
      # Without the two secrets it says so and succeeds; a refusal fails it; a
      # portal that is down only warns (scripts/send_dev_record.py).
      - name: "Send the gate's record to the portal"
        if: always()
        env:
          AGENTSMITH_PORTAL_URL: ${{ secrets.AGENTSMITH_PORTAL_URL }}
          AGENTSMITH_PORTAL_INGEST_TOKEN: ${{ secrets.AGENTSMITH_PORTAL_INGEST_TOKEN }}
        run: python3 scripts/send_dev_record.py "${RUNNER_TEMP:-/tmp}/dev-record.json"

  # The curated mutations, dealt across four runners. Each shard edits files in
  # place on its own checkout, so they never meet (.agent-rfc/designs/mutation-ci-fast.md).
  mutations:
    name: "Curated mutations (shard ${{ matrix.shard }}/4)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's suites are chosen against its base, which a
          # one-commit checkout does not have (it would then run every suite).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.lock"
      - run: pip install --require-hashes -r requirements.lock
      - name: "mutation_check.py (curated — the properties we chose to defend)"
        # agentsmith:gate
        # A pull request runs only the suites whose files it changed — the files
        # a suite mutates, its tests, what they import, a shared set — each
        # skip named; `main`, the weekly run and a manual run test every suite.
        # A base this clone cannot use runs them all.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          pip install pytest pytest-asyncio pydantic pyyaml httpx tenacity tiktoken
          args=()
          if [ -n "$SHARD" ]; then args+=(--shard "$SHARD/4"); fi
          if [ -n "$BASE" ]; then args+=(--changed-since "$BASE"); fi
          python3 scripts/mutation_check.py "${args[@]}"

  python:
    name: "Python scripts/runtime/examples"
    runs-on: ubuntu-latest
    # `main` requires this check by name, not the shards: it waits for them,
    # runs whatever they concluded, and its last step fails unless every shard
    # succeeded — so a failed, cancelled or skipped shard fails it.
    needs: mutations
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # One version, in .python-version — the one uv builds
          # ~/.agent-framework/.venv at and requirements.lock is compiled for.
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.lock"
      # The lock, not requirements.txt: the exact versions install-ai-stack.sh
      # puts on a machine, rather than whatever the index resolves today.
      - run: pip install --require-hashes -r requirements.lock
      - name: "ruff (lint config lives in pyproject.toml)"
        # agentsmith:gate
        # Ruff had no configuration and was run by NOTHING — not CI, not a hook
        # — so it ran on its defaults whenever a human happened to invoke it.
        # That is how the repo accumulated `# noqa` codes for rules that were
        # never enabled: suppressions reading as "checked and waived" while
        # nothing checked. RUF100 is selected precisely to keep that from
        # recurring, and it can only do that from here.
        run: |
          pip install -r requirements-lint.txt
          ruff check .
      - name: "mypy (shipped runtime only — see pyproject.toml for the scope)"
        # agentsmith:gate
        run: |
          pip install -r requirements-lint.txt
          mypy
      - name: "mutmut (exhaustive — ADVISORY, never gates a merge)"
        # Advisory on purpose. A surviving mutant is a question — "is this line
        # asserted, and should it be?" — not a defect, and a job that fails the
        # build on every one teaches a team to stop reading it. The curated
        # mutations job is the one that gates: each of its mutations was written
        # against a real defect and failed a test the day it was added.
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install -r requirements-lint.txt
          mutmut run || true
          echo "── surviving mutants (a reading list, not a score) ──"
          mutmut results || true
      - name: "py_compile sweep"
        # agentsmith:gate
        run: |
          find scripts runtime examples -name "*.py" -print0 | xargs -0 -n1 python3 -m py_compile
      - name: "docs/DESIGN.md repo-tree drift check (top level + key sub-trees)"
        # agentsmith:gate
        # docs/DESIGN.md › GitHub Repository holds the only copy of the repository tree (README links
        # to it). This diffs its top-level entries against git ls-files so tree
        # drift (renamed/added/removed top-level files or dirs) fails CI instead
        # of accumulating silently. Extended (ReviewFindings-2026-07-18 A2):
        # second-level entries of scripts/, runtime/, docs/, fixtures/ are now
        # diffed too — the P12 additions drifted for months at exactly that
        # depth while the top-level-only check stayed green.
        run: |
          python3 - <<'EOF'
          import fnmatch, re, subprocess, pathlib, sys
          specs = pathlib.Path("docs/DESIGN.md").read_text()
          m = re.search(r"### Repository Structure\n\n```\n(.*?)\n```", specs, re.S)
          assert m, "Repository Structure block missing from docs/DESIGN.md"

          # Parse the box-drawing tree into (depth, name) entries. A line like
          # "│   ├── foo.py  # comment" is depth 1, name "foo.py". Lines may
          # carry several names ("embeddings.py / vector_store.py") or a path
          # ("k8s/dedicated-tenant/" -> first component "k8s").
          entries = []  # (depth, name)
          for line in m.group(1).splitlines():
              lm = re.match(r"^((?:(?:│   )|(?:    ))*)[├└]── (.+)$", line)
              if not lm:
                  continue
              depth = len(lm.group(1)) // 4
              body = lm.group(2).split("#", 1)[0].strip()
              for name in (n.strip() for n in body.split(" / ")):
                  if name:
                      entries.append((depth, name.rstrip("/").split("/")[0]))

          top = {name for depth, name in entries if depth == 0}
          tracked_paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          tracked_top = {p.split("/")[0] for p in tracked_paths}
          ignore = {".DS_Store", ".claude"}
          missing = sorted(tracked_top - top - ignore)
          ghost = sorted(e for e in top if not pathlib.Path(e).exists())

          # Second-level check for the directories that actually drifted (P12).
          # workflow-templates added 2026-09-27: agentsmith-gates.yml and
          # agentsmith-sync.yml — the two workflows that carry the governance —
          # were absent from the tree's description of the directory holding them,
          # and a top-level-only check could not see it.
          DEEP_DIRS = ["scripts", "runtime", "docs", "fixtures", "workflow-templates"]
          IGNORE_SECOND = {"__init__.py", ".gitignore"}
          # Map: top-level dir -> second-level names listed under it in the tree.
          second: dict[str, set] = {d: set() for d in DEEP_DIRS}
          current_top = None
          for depth, name in entries:
              if depth == 0:
                  current_top = name
              elif depth == 1 and current_top in second:
                  second[current_top].add(name)
          deep_missing, deep_ghost = [], []
          for d in DEEP_DIRS:
              tracked_second = {
                  p.split("/")[1] for p in tracked_paths
                  if p.startswith(d + "/") and p.count("/") >= 1
              } - IGNORE_SECOND
              listed = second[d]
              for name in sorted(tracked_second):
                  if not any(fnmatch.fnmatch(name, pat) for pat in listed):
                      deep_missing.append(f"{d}/{name}")
              for name in sorted(listed):
                  if "*" in name:
                      continue
                  if not pathlib.Path(d, name).exists():
                      deep_ghost.append(f"{d}/{name}")

          if missing or ghost or deep_missing or deep_ghost:
              print("missing from docs/DESIGN.md tree (top level):", missing)
              print("in tree but absent on disk (top level):", ghost)
              print("missing from docs/DESIGN.md tree (second level):", deep_missing)
              print("in tree but absent on disk (second level):", deep_ghost)
              sys.exit(1)
          n2 = sum(len(v) for v in second.values())
          print(f"docs/DESIGN.md tree matches repo ({len(top)} top-level, {n2} second-level entries)")
          EOF
      - name: "Redaction compliance (staging + production profiles)"
        # agentsmith:gate
        run: |
          ENVIRONMENT=staging python3 scripts/verify_system.py --check-redaction
          ENVIRONMENT=production python3 scripts/verify_system.py --check-redaction
      - name: "Commit guardrails / enterprise RFC checks, through the gate"
        # agentsmith:gate
        run: python3 scripts/verify_system.py --check-hooks
      - name: "verify_system.py --check-kg (Knowledge Graph, docs/PRODUCT_ARCHIVE.md P10a)"
        # agentsmith:gate
        run: python3 scripts/verify_system.py --check-kg
      - name: "Set up Helm"
        uses: azure/setup-helm@v4
      - name: "On-prem deploy template (Compose + Helm syntax)"
        # agentsmith:gate needs=helm
        run: python3 scripts/verify_system.py --check-onprem-deploy
      - name: "Delivery Model soft gate (warn-only)"
        run: python3 scripts/verify_system.py --check-delivery-model
      - name: "Delivery evidence pack script"
        # agentsmith:gate
        run: python3 scripts/delivery_evidence.py
      - name: "Unit tests — delivery model + fairness + input guardrail"
        # agentsmith:gate
        run: |
          pip install pytest pyyaml
          PYTHONPATH=scripts:. pytest scripts/test/test_delivery_model.py scripts/test/test_fairness_evals.py runtime/test/test_input_guardrail.py -q
      - name: "Every curated-mutation shard passed"
        # agentsmith:gate
        # Locally it has no shards to read, and is skipped by name; the
        # mutation step above it runs there instead.
        if: ${{ !cancelled() }}
        env:
          RESULT: ${{ needs.mutations.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            echo "✅ every curated-mutation shard passed"
          else
            echo "::error::the curated mutations concluded '$RESULT' — open the failing 'Curated mutations' shard"
            exit 1
          fi

  python-behaviour:
    name: "Python runtime behaviour tests (Postgres-backed)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      IDEMPOTENCY_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # One version, in .python-version — the one uv builds
          # ~/.agent-framework/.venv at and requirements.lock is compiled for.
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.lock"
      # The lock, not requirements.txt: the exact versions install-ai-stack.sh
      # puts on a machine, rather than whatever the index resolves today.
      - run: pip install --require-hashes -r requirements.lock
      - name: "Cache Temporal test-server binary"
        # The Python SDK caches the downloaded dev-server CLI under
        # $TMPDIR/temporal-sdk-python-<version> (confirmed by running it
        # locally — not documented, so checked rather than assumed). /tmp
        # doesn't persist across separate Actions runs on its own; this
        # cache step is what makes it actually stick between CI runs.
        uses: actions/cache@v4
        with:
          path: /tmp/temporal-sdk-python-*
          key: temporal-testsrv-${{ runner.os }}
      - name: "pytest (runtime/test/)"
        # agentsmith:gate
        run: pytest runtime/test/ -v
      - name: "pytest (scripts/test/ — shadow eval sampling)"
        # agentsmith:gate
        run: pytest scripts/test/ -v
      - name: "verify_system.py --check-idempotency"
        # agentsmith:gate
        run: python3 scripts/verify_system.py --check-idempotency
      - name: "verify_system.py --check-dlq"
        # agentsmith:gate
        run: python3 scripts/verify_system.py --check-dlq

  shell:
    name: "Shell scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "bash -n / zsh -n syntax check"
        # agentsmith:gate
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh > /dev/null
          bash -n install-ai-stack.sh
          zsh -n install-ai-stack.sh
          for f in enterprise/*.sh runtime/k8s/dedicated-tenant/render.sh hooks/*; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
      - name: "ShellCheck"
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "node_modules portal/node_modules templates/in-app-widget/node_modules"
          severity: warning
        continue-on-error: true # advisory — does not block, no existing baseline to compare against

  portal:
    name: "Ops Portal (Next.js)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      AUDIT_LOG_HMAC_KEY: "ci-test-key-not-a-real-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Portal scripts run TypeScript via `node --experimental-strip-types`,
          # which needs Node >=22.6 (Node 20 rejects the flag with "bad option").
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: "npx tsc --noEmit — the portal type-checks"
        # agentsmith:gate no-services
        # One qualifier per tag (gate_steps.Step.needs is a single value), and
        # `no-services` is the useful one here: a type check wants no database,
        # and npx ships wherever node does.
        run: npx tsc --noEmit
      - run: npm run db:migrate
      - name: "npm test — cross-tenant isolation (no DB required)"
        # agentsmith:gate no-services
        run: npm test
      - name: "npm run test:db — audit log HMAC sign/verify + tamper detection"
        # agentsmith:gate needs=npm
        run: npm run test:db
      - name: "npm run build — the portal builds"
        # agentsmith:gate needs=npm
        run: npm run build
      - name: "Start portal for the Ops contract check"
        env:
          OPS_PORTAL_USER: "ci"
          OPS_PORTAL_PASSWORD: "ci-test-password"
        run: |
          npm run start &
          # No -f: a 401 (no token, expected) still means the server is up
          # and responding — curl without -f only exits non-zero on an actual
          # connection failure (refused/timeout), the readiness signal wanted.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/api/ops/ingest -X POST -d '{}' && break
            sleep 1
          done
      - name: "Seed an app and its Ops token"
        # The portal stores a token's SHA-256 only; this inserts the hash of a
        # CI-only token, scoped `ops`, for a throwaway app.
        env:
          OPS_TOKEN: "aso_ci-ops-token-not-a-real-secret"
        run: |
          hash=$(printf %s "$OPS_TOKEN" | sha256sum | cut -d' ' -f1)
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO tenants (tenant_id, name) VALUES ('ci-ops-conformance', 'ci-ops-conformance') ON CONFLICT DO NOTHING;
             INSERT INTO app_ingest_tokens (token_hash, tenant_id, created_by, scope)
               VALUES ('$hash', 'ci-ops-conformance', 'ci', 'ops') ON CONFLICT DO NOTHING;"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: pip install -r scripts/requirements-gate.txt
        working-directory: ${{ github.workspace }}
      - name: "The Ops contract, receiver side (against the live portal above)"
        # agentsmith:gate
        working-directory: ${{ github.workspace }}
        env:
          GOVERNANCE_OPS_TOKEN: "aso_ci-ops-token-not-a-real-secret"
        run: python3 -m runtime.cli conformance --port ops --receiver http://localhost:3000/api/ops/ingest

  security:
    name: "Security harness"
    uses: ./.github/workflows/eval-security.yml
    with:
      strict: true

  widget:
    name: "In-App Widget"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/in-app-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: templates/in-app-widget/package-lock.json
      - run: npm ci
      - name: "npm test — the in-app widget"
        # agentsmith:gate needs=npm
        run: npm test
