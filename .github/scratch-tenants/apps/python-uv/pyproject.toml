[project]
name = "uv-tenant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

# A uv project configures ruff here, so the hook's vendored ruff.toml files
# must `extend` this one rather than replace it.
[tool.ruff]
line-length = 100
