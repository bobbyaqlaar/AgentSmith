# This repository's own CI, as it stood before it was adopted. `tenant adopt`
# leaves it alone and adds .github/workflows/agentsmith-gates.yml beside it.
name: "CI"

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
