# AgentSmith — packaging for the production runtime (TestbedFeedback G6).
#
# Why this exists: `runtime/` was importable only by putting the framework
# checkout (or the runtime/ directory itself) on sys.path. That ambiguity is
# what produced the `try: from runtime.X import Y / except ImportError: from X
# import Y` dance in 8 runtime modules — every module had to work under both
# layouts because neither was guaranteed. A tenant additionally needed a
# path-bootstrap module before it could import anything, and its Dockerfile
# had to COPY the framework from a parent directory, so the image could not
# be built from the tenant repo alone.
#
# Installing makes `import runtime` unconditional, so the fallbacks are gone
# and a tenant can just depend on the framework:
#
#     pip install -e /path/to/AgenticFramework          # local checkout
#     pip install "agentsmith-runtime @ git+https://github.com/bobbyaqlaar/AgentSmith@v1.1.0"
#
# Scope: only `runtime/` is packaged. `scripts/` stays file-invoked — it is
# installed to ~/.agent-framework by install-ai-stack.sh and run as
# `python3 scripts/foo.py`, and several of its filenames contain dashes, so
# it is not importable as a package anyway.
#
# NOTE on the import name: the package is distributed as `agentsmith-runtime`
# but imports as `runtime`, matching every existing call site. `runtime` is a
# generic top-level name and could collide in a crowded virtualenv; renaming
# it to `agentsmith_runtime` is a follow-up worth doing on a major version,
# not something to change under a tenant mid-release (it would break every
# `from runtime.X import Y` in every tenant repo at once).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsmith-runtime"
version = "1.3.0"
description = "AgentSmith production runtime — LLM gateway, guardrails, durable workflow helpers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Bobby Rajagopal" }]
keywords = ["agents", "llm", "guardrails", "observability", "temporal"]

# Kept in sync with runtime/requirements-runtime.txt, which stays the
# canonical list for deployments that vendor rather than install.
dependencies = [
    "httpx>=0.25,<1.0",
    "tenacity>=8.2,<10.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
# The framework's entry point. Everything a user does went through fifteen zsh
# functions written into ~/.zshrc — undrifting them, testing them, or running
# them on Windows or in a container was impossible. A console script is none of
# those things. See runtime/cli.py for the migration path.
agentsmith = "runtime.cli:main"

[project.optional-dependencies]
# Backends are optional so a tenant that only needs the gateway + guardrails
# doesn't pull psycopg2/boto3/temporalio. Matches how the runtime imports
# them lazily inside the methods that need them.
postgres = ["psycopg2-binary>=2.9,<3.0"]
redis = ["redis>=5.0,<6.0"]
temporal = ["temporalio>=1.5,<2.0"]
hitl = ["cryptography>=42.0,<44.0"]
cloud = ["google-auth>=2.30,<3.0", "boto3>=1.34,<2.0", "aiohttp>=3.9,<4.0"]
all = [
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "temporalio>=1.5,<2.0",
    "cryptography>=42.0,<44.0",
    "google-auth>=2.30,<3.0",
    "boto3>=1.34,<2.0",
    "aiohttp>=3.9,<4.0",
]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0"]

[project.urls]
Homepage = "https://github.com/bobbyaqlaar/AgentSmith"

[tool.setuptools]
# Explicit list, not auto-discovery: the repo root also contains scripts/,
# portal/, templates/, examples/ and fixtures/, none of which are Python
# packages meant for distribution.
packages = ["runtime", "runtime.workflows"]

[tool.setuptools.package-data]
runtime = ["models.yaml", "requirements-runtime.txt"]

# ── Lint ──────────────────────────────────────────────────────────────────────
#
# Ruff had no configuration and was not run by CI or any hook, so it ran on its
# defaults (E4, E7, E9, F) whenever someone happened to invoke it. That is why
# the repo accumulated `# noqa` codes for rules that were never enabled —
# BLE001, N802, D401, A002 — suppressions that read as "checked and waived"
# while nothing checked. RUF100 is selected below precisely to keep that from
# happening again.
#
# The selection is deliberate rather than maximal. Two families were measured
# and rejected: `S` (bandit) reports 1429, almost all of it every subprocess
# call and every assert; `BLE` reports 130, which is this repo's deliberate
# fail-open idiom already governed by scripts/check_bare_except.py's stricter
# rule that each one carry a `# fail-open:` justification. Turning either on
# would produce noqa noise, and a lint rule that is mostly waived teaches people
# to waive lint rules.
#
# What IS here earns its place: PLW1510 caught `subprocess.run` without an
# explicit `check`, which is exactly how notifier._notify_osascript reported
# every attempt as delivered however osascript exited.
[tool.ruff]
line-length = 120
extend-exclude = [".venv", "node_modules", ".next", "portal/.next"]

[tool.ruff.lint]
select = ["E", "F", "N", "B", "RUF", "PLW1510"]
ignore = [
    # Em dashes and typographic quotes are house style in this codebase's
    # comments, which carry the reasoning rather than restating the code.
    "RUF001", "RUF002", "RUF003",
    # `CircuitBreakerTripped` is a signal, not a fault report, and it is public
    # API for tenants that call the breaker directly. An Error suffix would be
    # a rename for a naming rule.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests bind fixtures and doubles at module scope after a sys.path insert.
"*/test/*" = ["E402"]
# Fully-qualified protobuf type URLs — e.g.
# "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager
# .v3.HttpConnectionManager" — are single tokens. Wrapping one changes the
# config this script emits. A narrow exemption with a reason, not a waiver.
"templates/onprem-deploy/scripts/render-envoy-config.py" = ["E501"]

# ── Types ─────────────────────────────────────────────────────────────────────
#
# SHIPPED RUNTIME ONLY. Two exclusions, both deliberate:
#
#   runtime/test/ — 20 of the original 33 errors were `method-assign` from
#   monkeypatching doubles onto real objects, which is what a test double IS.
#   Type-checking there fights the pattern instead of finding defects.
#
#   scripts/ — the dev-lifecycle harness, not what a tenant imports.
#
# It earns its place on one finding: `_invoke` declared `-> tuple[str, int, int]`
# while returning `parse_response`'s Optionals. That annotation was a false
# guarantee, and it is precisely the guarantee scripts/cost_router.py trusted
# when it passed None into the circuit breaker — where the TypeError landed in a
# fail-open handler and the call went unmetered on both tiers. Review found that
# one after it shipped; mypy names it in milliseconds.
[tool.mypy]
# No `python_version` pin. Pinning it to the minimum supported 3.11 makes mypy
# parse third-party stubs under 3.11 rules, and numpy's ship 3.12+ syntax — so
# the run dies on a dependency's stub rather than on this repo's code. The
# running interpreter decides instead; CI is 3.11, which is the version that
# matters.
files = ["runtime"]
exclude = ["runtime/test/"]
ignore_missing_imports = true

# `ignore_missing_imports` does NOT cover a library that has a published stub
# package — mypy reports `import-untyped` and names the package instead, which
# is the more useful answer. `types-PyYAML` is installed alongside mypy in CI.
# Local runs passed because the venv happened to have it; CI did not. Recording
# it here so the next person is not diagnosing an environment difference.
